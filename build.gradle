plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.28"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

mixin {
    if (file("src/main/resources/susu609.mixins.json").exists()) {
        add sourceSets.main, "susu609.refmap.json"
        config "susu609.mixins.json"
    }
}


// ===== Thông tin bản build: nhánh + commit, in ra log build và log game =====
def gitText = { String... args ->
    providers.exec {
        commandLine(['git'] + args.toList())
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }.orElse('')
}
def gitBranch = gitText('rev-parse', '--abbrev-ref', 'HEAD')
def gitCommit = gitText('rev-parse', '--short', 'HEAD')
def gitDirty = gitText('status', '--porcelain')
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo')

tasks.register('generateBuildInfo') {
    def outFile = buildInfoDir.map { it.file('susu609_build.properties') }
    outputs.file(outFile)
    outputs.upToDateWhen { false } // luôn ghi lại để thời gian và commit đúng
    doLast {
        def branch = gitBranch.get() ?: 'unknown'
        def commit = gitCommit.get() ?: 'unknown'
        def state = gitDirty.get() ? 'dirty' : 'clean'
        def time = new Date().format('yyyy-MM-dd HH:mm:ss')
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.setText("branch=${branch}\ncommit=${commit}\nstate=${state}\ntime=${time}\n", 'UTF-8')
        println "BUILD_INFO: ${branch} @ ${commit} (${state}) build ${time}"
    }
}
sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') { dependsOn 'generateBuildInfo' }

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    // Claude API cho Clawd (xem ghi chú về thư viện phụ)
    implementation(jarJar("com.anthropic:anthropic-java:3.3.0"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    if (file("src/main/resources/susu609.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "susu609.mixins.json"
        ])
    }
}

apply from: 'mcreator.gradle'
