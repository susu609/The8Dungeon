name: Cập nhật sơ đồ kiến trúc

on:
  push:
    branches: [main]
    paths:
      - "src/main/java/**"
      - "src/main/resources/**"
      - "tools/gen_architecture.py"
      - ".github/workflows/architecture.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/gen_architecture.py

      - name: Commit ARCHITECTURE.md nếu có thay đổi
        run: |
          if git diff --quiet -- docs/ARCHITECTURE.md; then
            echo "Không có gì thay đổi."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ARCHITECTURE.md
            git commit -m "docs: cập nhật sơ đồ kiến trúc tự động"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
