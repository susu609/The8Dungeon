name: Cập nhật sơ đồ kiến trúc

on:
  push:
    paths:
      - "src/main/java/**"
      - "src/main/resources/**"
      - "tools/gen_architecture.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/gen_architecture.py
      - name: Commit nếu có thay đổi
        run: |
          if git diff --quiet -- docs/ARCHITECTURE.md; then
            echo "Không có gì thay đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          git commit -m "docs: cập nhật sơ đồ kiến trúc tự động"
          git push
